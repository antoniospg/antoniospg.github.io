<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.math %}{% include mathjax.html %}{% endif %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.theme-toggle');
      function label() { button.textContent = root.dataset.theme === 'dark' ? 'Light' : 'Dark'; }
      label();
      button.addEventListener('click', function () {
        var dark = root.dataset.theme !== 'dark';
        if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme;
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        label();
      });
    })();
  </script>
</body>
</html>
